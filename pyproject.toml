[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rojgaar-scout"
version = "0.1.0"
description = "Local-first job search agent for AI coding CLIs (Claude Code, Codex, Muse): scans job boards daily, ranks openings against your profile, drafts truthful tailored CVs. Never submits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rojgaar-Scout contributors" }]
keywords = ["job-search", "claude-code", "codex", "mcp", "agent", "resume"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# MCP server for Claude Code / Codex / Muse. Supports mcp 2.x (MCPServer) and 1.x (FastMCP).
mcp = ["mcp>=1.2"]
# Optional local embeddings for stage-2 scoring (falls back to BM25-only when absent).
embeddings = ["fastembed>=0.4"]
# Optional PDF rendering via RenderCV (Typst, no LaTeX needed).
render = ["rendercv[full]>=2.0"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
rojgaar = "rojgaar.cli:main"

[project.urls]
Homepage = "https://github.com/<your-org>/Rojgaar-Scout-Agent"

[tool.hatch.build.targets.wheel]
packages = ["src/rojgaar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "integration: end-to-end tests across several modules (offline, mocked HTTP)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905", "B008"]
